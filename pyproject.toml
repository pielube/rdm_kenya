[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdm-kenya"
version = "0.1.0"
description = "RDM Kenya workflow and analysis tools."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "xlsxwriter",
    "openpyxl",
    "matplotlib",
    "seaborn",
    "scikit-learn",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
